<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#8C6D12" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <!-- Refined inner gold border -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Elegant 'A' Lettermark -->
  <g filter="url(#subtleGlow)">
    <!-- Main Stems and Serifs -->
    <path
      d="M232 120 L280 120 L394 382 L422 382 L422 396 L318 396 L318 382 L344 382 L315 310 L197 310 L168 382 L194 382 L194 396 L90 396 L90 382 L118 382 Z M256 166 L211 282 L301 282 Z"
      fill="#F7F5F2"
    />
    <!-- Signature Gold Crossbar Accent -->
    <path
      d="M190 292 L322 292 L322 306 L190 306 Z"
      fill="url(#goldGrad)"
    />
  </g>
</svg>
